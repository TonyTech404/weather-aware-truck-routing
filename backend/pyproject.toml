[project]
name = "routeguard-api"
version = "0.1.0"
description = "RouteGuard weather-aware truck routing API (Django on Cloudflare Python Workers)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-cors-headers>=4.7",
    "tzdata",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
