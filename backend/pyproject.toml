[project]
name = "routeguard-api"
version = "0.1.0"
description = "RouteGuard weather-aware truck routing API (Django on Cloudflare Python Workers)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-cors-headers>=4.7",
    "tzdata",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
test = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-django>=4.9",
    "pytest-env>=1.1",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "routeguard.settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env = ["DJANGO_SECRET_KEY=test-only-secret"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
