name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_URL: https://routeguard-api.hernandezmarkanthony61.workers.dev
  WEB_URL: https://routeguard-web.hernandezmarkanthony61.workers.dev

jobs:
  backend:
    name: Backend (ruff, Django checks, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Django system check (deployment profile)
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: Unit tests (risk, sampling, ETAs, ranking, services, API)
        run: uv run pytest -q

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.13
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare and smoke test
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; skipping deployment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.enabled == 'true'
      - uses: astral-sh/setup-uv@v10
        if: steps.creds.outputs.enabled == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Deploy API (Django on Python Workers)
        if: steps.creds.outputs.enabled == 'true'
        working-directory: backend
        run: |
          uv sync --locked --python 3.13
          npm ci
          uv run pywrangler deploy
      - name: Deploy web (Workers Static Assets)
        if: steps.creds.outputs.enabled == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
        run: |
          npm ci
          npm run build
          npx wrangler deploy
      - name: Wait for the API to answer
        if: steps.creds.outputs.enabled == 'true'
        run: curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$API_URL/api/health"
      - name: Install Playwright browser
        if: steps.creds.outputs.enabled == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Production smoke test (live providers)
        if: steps.creds.outputs.enabled == 'true'
        working-directory: frontend
        env:
          SMOKE_WEB_URL: ${{ env.WEB_URL }}
          SMOKE_API_URL: ${{ env.API_URL }}
          CI: "true"
        run: npm run e2e:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: frontend/test-results
          retention-days: 7
